<style>
.social-menu{

.social-menu a,
.social-menu button{
    width:100%;
    padding:15px;
    border:0;

    background:#151515;
    color:white;
    text-decoration:none;

.social-menu a:hover,

}

.coffee-page h2{

.qris-image{

<script>
function openCoffee(){
    document.querySelector('.social-menu').style.display = 'none';
    document.getElementById('coffeePage').style.display = 'block';

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}

function closeCoffee(){
    document.getElementById('coffeePage').style.display = 'none';
    document.querySelector('.social-menu').style.display = 'flex';

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}
</script>
