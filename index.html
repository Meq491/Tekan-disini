<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEQ491 - Sosial Media</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 30px 20px;
    text-align: center;
}


/* LOGO MEQ */

.logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #111;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 15px;

    font-size: 25px;
    font-weight: bold;

    border: 2px solid #333;
}


/* JUDUL */

h1 {
    margin: 10px 0 5px;
    font-size: 30px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}


/* TOMBOL SOSIAL */

.social {
    display: flex;
    align-items: center;

    gap: 15px;

    text-decoration: none;
    color: white;

    background: #151515;

    border: 1px solid #292929;

    border-radius: 15px;

    padding: 15px;

    margin: 12px 0;

    transition: 0.2s;
}

.social:hover {
    transform: scale(1.02);
    background: #202020;
}


/* LOGO SOSIAL */

.icon {
    width: 50px;
    height: 50px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
    font-weight: bold;

    flex-shrink: 0;
}


/* FACEBOOK */

.facebook {
    background: #1877f2;
}


/* TELEGRAM */

.telegram {
    background: #229ed9;
}


/* INSTAGRAM */

.instagram {
    background: linear-gradient(
        135deg,
        #833ab4,
        #fd1d1d,
        #fcb045
    );
}


/* TEKS */

.text {
    text-align: left;
}

.text strong {
    display: block;
    font-size: 17px;
}

.text span {
    color: #999;
    font-size: 13px;
}

</style>
</head>


<body>

<div class="container">


    <!-- LOGO -->

    <div class="logo">
        MEQ
    </div>


    <!-- JUDUL -->

    <h1>
        MEQ491
    </h1>

    <div class="subtitle">
        Sosial Media
    </div>


    <!-- FACEBOOK -->

    <a
        class="social"
        href="https://www.facebook.com/share/1JuqSUvVT6/"
        target="_blank"
        rel="noopener noreferrer"
    >

        <div class="icon facebook">
            f
        </div>

        <div class="text">

            <strong>
                Facebook
            </strong>

            <span>
                Kunjungi akun Facebook saya
            </span>

        </div>

    </a>


    <!-- TELEGRAM -->

    <a
        class="social"
        href="https://t.me/meq491"
        target="_blank"
        rel="noopener noreferrer"
    >

        <div class="icon telegram">
            ✈
        </div>

        <div class="text">

            <strong>
                Telegram
            </strong>

            <span>
                @meq491
            </span>

        </div>

    </a>


    <!-- INSTAGRAM -->

    <a
        class="social"
        href="https://www.instagram.com/meqq491/"
        target="_blank"
        rel="noopener noreferrer"
