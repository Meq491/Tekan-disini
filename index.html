<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEQ491 - Sosial Media</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 30px 20px;
    text-align: center;
}

.logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    font-size: 25px;
    font-weight: bold;
    border: 2px solid #333;
}

h1 {
    margin: 10px 0 5px;
    font-size: 30px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

.social {
    display: flex;
    align-items: center;
    gap: 15px;
    text-decoration: none;
    color: white;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 15px;
    padding: 15px;
    margin: 12px 0;
    transition: 0.2s;
}

.social:hover {
    transform: scale(1.02);
    background: #202020;
}

.icon {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: bold;
}

.facebook {
    background: #1877f2;
}

.telegram {
    background: #229ed9;
}

.instagram {
    background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
}

.coffee {
    width: 100%;
    border: none;
    cursor: pointer;
    color: white;
    background: #1b1b1b;
    display: flex;
    align-items: center;
    gap: 15px;
    border-radius: 15px;
    padding: 15px;
    margin-top: 12px;
    border: 1px solid #292929;
    font-size: 16px;
}

.coffee:hover {
    background: #252525;
}

.coffee-icon {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    background: #8b5a2b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
}

.text {
    text-align: left;
}

.text strong {
    display: block;
    font-size: 17px;
}

.text span {
    color: #999;
    font-size: 13px;
}

#qrBox {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 18px;
}

#qrBox h2 {
    margin-top: 0;
}

#qrBox img {
    width: 100%;
    max-width: 300px;
    border-radius: 10px;
    background: white;
    padding: 10px;
}

.close {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">MEQ</div>

    <h1>MEQ491</h1>
    <div class="subtitle">Sosial Media &amp; BUAT NGOPI</div>


    <!-- FACEBOOK -->
    <a
        class="social"
        href="https://www.facebook.com/share/1JuqSUvVT6/"
        target="_blank"
        rel="noopener noreferrer"
    >
        <div class="icon facebook">f</div>
        <div class="text">
            <strong>Facebook</strong>
            <span>Kunjungi akun Facebook saya</span>
        </div>
    </a>


    <!-- TELEGRAM -->
    <a
        class="social"
        href="https://t.me/meq491"
        target="_blank"
        rel="noopener noreferrer"
    >
        <div class="icon telegram">✈</div>
        <div class="text">
            <strong>Telegram</strong>
            <span>@meq491</span>
        </div>
    </a>


    <!-- INSTAGRAM -->
    <a
        class="social"
        href="https://www.instagram.com/meqq491/"
        target="_blank"
        rel="noopener noreferrer"
    >
        <div class="icon instagram">◎</div>
        <div class="text">
            <strong>Instagram</strong>
            <span>@meqq491</span>
        </div>
    </a>


    <!-- BUAT NGOPI -->
    <button class="coffee" onclick="bukaQR()">
        <div class="coffee-icon">☕</div>
        <div class="text">
            <strong>BUAT NGOPI</strong>
            <span>Klik untuk melihat QR Code</span>
        </div>
    </button>


    <!-- QR CODE -->
    <div id="qrBox">
        <h2>☕ BUAT NGOPI</h2>
        <p>Scan QR Code di bawah ini</p>

        <!-- GANTI qr-code.png DENGAN NAMA FILE QR CODE KAMU -->
        <img src="qr-code.png" alt="QR Code Buat Ngopi">

        <br>

        <button class="close" onclick="tutupQR()">
            Tutup
        </button>
    </div>

</div>


<script>
function bukaQR() {
    document.getElementById("qrBox").style.display = "block";
}

function tutupQR() {
    document.getElementById("qrBox").style.display = "none";
}
</script>

</body>
</html>
