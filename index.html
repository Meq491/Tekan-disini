<style>

.social-menu{
    display:flex;
    flex-direction:column;
    gap:16px;
    width:100%;
    max-width:650px;
    margin:20px auto;
}

.social-btn{
    width:100%;
    min-height:70px;
    border:none;
    border-radius:18px;
    color:white;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:18px;
    padding:15px 22px;
    font-size:20px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
}

.social-icon{
    width:45px;
    height:45px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.18);
    font-size:29px;
    font-weight:900;
}

/* WARNA APLIKASI */

.instagram{
    background:linear-gradient(
        135deg,
        #833ab4,
        #fd1d1d,
        #fcb045
    );
}

.facebook{
    background:#1877f2;
}

.telegram{
    background:#229ed9;
}


/* HALAMAN */

.halaman-sosmed{
    display:none;
    width:100%;
    max-width:650px;
    margin:20px auto;
    padding:30px 20px;
    text-align:center;
    background:#111;
    border:1px solid #292929;
    border-radius:20px;
}

.halaman-sosmed h2{
    color:white;
    font-size:27px;
    margin:12px 0 8px;
}

.halaman-sosmed p{
    color:#aaa;
    font-size:17px;
    margin-bottom:25px;
}


/* LOGO BESAR */

.logo-instagram,
.logo-facebook,
.logo-telegram{
    width:80px;
    height:80px;
    margin:auto;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:48px;
    font-weight:900;
}

.logo-instagram{
    background:linear-gradient(
        135deg,
        #833ab4,
        #fd1d1d,
        #fcb045
    );
}

.logo-facebook{
    background:#1877f2;
}

.logo-telegram{
    background:#229ed9;
}


/* TOMBOL BUKA AKUN */

.buka-akun{
    display:block;
    width:100%;
    padding:17px;
    border-radius:14px;
    color:white;
    text-decoration:none;
    font-size:17px;
    font-weight:800;
}

.instagram-bg{
    background:linear-gradient(
        135deg,
        #833ab4,
        #fd1d1d,
        #fcb045
    );
}

.facebook-bg{
    background:#1877f2;
}

.telegram-bg{
    background:#229ed9;
}


/* KEMBALI */

.kembali{
    width:100%;
    margin-top:14px;
    padding:16px;
    border:1px solid #333;
    border-radius:14px;
    background:#1b1b1b;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.kembali:hover{
    background:#292929;
}

</style>


<script>

function buka(nama){

    document.querySelector('.social-menu').style.display='none';

    document.querySelectorAll('.halaman-sosmed').forEach(function(halaman){
        halaman.style.display='none';
    });

    document.getElementById(nama).style.display='block';

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}

function kembali(){

    document.querySelectorAll('.halaman-sosmed').forEach(function(halaman){
        halaman.style.display='none';
    });

    document.querySelector('.social-menu').style.display='flex';

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}

</script>
